name: Run Arabic Wikisource Bot (Python)

on:
  schedule:
    # 15:00 UTC is exactly 6:00 PM Baghdad time
    - cron: '20 15 * * *'
  workflow_dispatch: # This adds a manual "Run" button so you don't have to wait for cron

jobs:
  run-bot:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install requests

      - name: Execute Python Script
        run: python bot.py
        env:
          WIKI_PASSWORD: ${{ secrets.WIKI_PASSWORD }}
